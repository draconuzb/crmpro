services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crmpro
      POSTGRES_USER: crmpro
      POSTGRES_PASSWORD: crmpro_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
