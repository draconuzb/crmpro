name: Deploy to Production

on:
  push:
    branches: [main]

env:
  DEPLOY_PATH: /home/ubuntu/modme-crm

jobs:
  build-web:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @modme/shared build 2>/dev/null || true

      - name: Build web
        run: pnpm --filter web build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-web
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          script: |
            set -e
            echo "══════ Deploying Modme CRM ══════"
            cd ${{ env.DEPLOY_PATH }}

            if [ ! -f .env ]; then
              echo "⚠ No .env file found!"
              exit 1
            fi

            echo "→ Building & starting containers..."
            docker compose -f docker-compose.prod.yml up -d --build

            echo "→ Waiting for services..."
            sleep 10

            echo "→ Cleaning up..."
            docker image prune -f

            echo "══════ Deploy complete! ══════"

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sleep 5
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80 || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Health check passed (HTTP $HTTP_CODE)"
            else
              echo "✗ Health check failed (HTTP $HTTP_CODE)"
              docker compose -f /home/ubuntu/modme-crm/docker-compose.prod.yml logs --tail=50
              exit 1
            fi
