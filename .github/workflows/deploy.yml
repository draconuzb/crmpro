name: Deploy CRMPro

on:
  push:
    branches: [master]

env:
  DEPLOY_PATH: /home/ubuntu/crmpro

jobs:
  build-web:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @crmpro/shared build 2>/dev/null || true

      - name: Build web
        run: pnpm --filter @crmpro/web build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @crmpro/shared build 2>/dev/null || true

      - name: Build API
        run: pnpm --filter @crmpro/api build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist
          retention-days: 1

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build-web, build-api]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Download API dist
        uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          script: |
            set -e
            echo "══════ Deploying CRMPro ══════"
            cd ${{ env.DEPLOY_PATH }}

            if [ ! -f .env ]; then
              echo "⚠ No .env file found!"
              exit 1
            fi

            echo "→ Building & starting containers (API + Web + Bot)..."
            docker compose -f docker-compose.prod.yml up -d --build

            echo "→ Waiting for services..."
            sleep 15

            echo "→ Cleaning up old images..."
            docker image prune -f

            echo "══════ Deploy complete! ══════"

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sleep 5

            # Check API health
            API_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health 2>/dev/null || echo "000")
            echo "API health: HTTP $API_CODE"

            # Check Web
            WEB_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80 || echo "000")
            echo "Web health: HTTP $WEB_CODE"

            if [ "$WEB_CODE" = "200" ]; then
              echo "✓ All health checks passed"
            else
              echo "✗ Health check failed"
              docker compose -f /home/ubuntu/crmpro/docker-compose.prod.yml logs --tail=30
              exit 1
            fi
